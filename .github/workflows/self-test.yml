# Orbit Self-Test — Live QA Proof (GREEN path)
#
# This is Orbit's own regression suite: it calls Orbit's reusable workflows
# against committed "clean" fixtures under self-test/fixtures/ and asserts
# each gate stays GREEN. This workflow is itself a normal required-check
# candidate (it is SUPPOSED to stay green) — the matching RED-path proof
# (each gate correctly turns red on a bad fixture) lives in the separate
# `self-test-red-path.yml`, dispatch-only, because a reusable-workflow
# `uses:` job cannot carry `continue-on-error:` (GitHub Actions restriction —
# only `name`/`uses`/`with`/`secrets`/`needs`/`if`/`permissions` are legal
# keys on that job shape), so a job that's SUPPOSED to fail cannot be safely
# folded into a workflow run that also needs to report a clean, blockable
# green/red signal for other jobs in the same run.
#
# Fixture provenance:
#   - self-test/fixtures/secrets/injected.txt — a well-known AWS
#     documentation EXAMPLE credential (never a real secret), committed on
#     `main` AFTER the `self-test/base` branch point. secret-detection.yml's
#     incremental scan diffs base_ref..HEAD, so relative to `self-test/base`
#     this file always appears "newly added" regardless of how far `main`
#     has advanced since.
#       - known.secrets.baseline already contains this exact finding → PASS (this workflow).
#       - empty.secrets.baseline does not → FAIL (self-test-red-path.yml).
#   - self-test/fixtures/secrets/exclude-globs/injected-should-be-excluded.txt
#     — same fake AWS example key, added alongside injected.txt for the
#     `exclude_globs` self-test (CR-A079-14 Part O / F4). This finding IS
#     also added to known.secrets.baseline (so the plain secret-detection-pass
#     job above, which passes no exclude_globs, isn't broken by this file's
#     mere existence). The exclude_globs proof itself needs a baseline that
#     does NOT already know about this file — that's
#     self-test/fixtures/secrets/exclude-globs/pass.secrets.baseline, an
#     otherwise-identical copy of known.secrets.baseline with that one entry
#     omitted. One pattern, `self-test/fixtures/secrets/exclude-globs/*`,
#     matches ONLY this fixture:
#       - secret-detection-exclude-globs-pass (this workflow): the
#         NOT-pre-baselined pass.secrets.baseline + that exclude_globs
#         pattern → the fixture is never scanned at all → its otherwise-new
#         finding never surfaces → PASS. (If exclude_globs were broken/inert,
#         this job would go RED instead, since pass.secrets.baseline has no
#         entry for it.)
#       - secret-detection-exclude-globs-still-blocks-fail
#         (self-test-red-path.yml): empty.secrets.baseline + the SAME
#         exclude_globs pattern, but the sibling ../injected.txt is NOT
#         matched by that pattern → still detected → FAIL. Proves
#         exclude_globs doesn't silently widen past what it's told to match.
#   - self-test/fixtures/alembic-{ok,conflict}/ — static Alembic version
#     trees (1 head / 2 heads). alembic-single-head.yml doesn't diff
#     anything — it just runs `alembic heads` in the given `alembic_dir` —
#     so both fixtures live side-by-side in every commit with no branch
#     tricks needed; ok is tested here, conflict is tested in the red-path
#     workflow.
#   - self-test/fixtures/build-push-sha/Dockerfile — a trivial dummy image
#     (CR-A079-15). build-push-sha.yml itself always does a real OIDC
#     role-assume + ECR login + `push: true` — self-test has neither an AWS
#     role nor an ECR repo to push to, and must not touch real infra. So the
#     contract is validated two ways, both with ZERO AWS/ECR calls: (1)
#     scripts/resolve-image-uri.sh — the exact tag-resolution logic the real
#     workflow's "Resolve image URI" step calls — run directly against
#     fixture inputs and asserted against the expected `<repo>:<sha>` output
#     (no mutable-tag suffix, ever); (2) a local docker/build-push-action run
#     against this fixture Dockerfile with `push: false` proves the
#     Dockerfile/context/buildx leg builds cleanly. Neither step is
#     `uses: ./.github/workflows/build-push-sha.yml` — that reusable
#     workflow requires real `oidc_role_arn`/`ecr_repository` inputs this
#     repo cannot provide from a self-test. The mutable-tag invariant
#     (CR-A079-15 Invariant 2) is checked separately, scoped to the
#     `docker/build-push-action` step's `with:` block — NOT a naive
#     whole-file `grep latest`, which would false-positive on this file's
#     own `runs-on: ubuntu-latest` (and every other workflow in this repo).
#   - post-deploy-smoke-pass targets `https://example.com` (IANA-reserved,
#     stable, always 200) — a real public URL, proving the gate's actual
#     curl-with-retries path end-to-end; the matching red path (a known-404
#     URL, expecting 200) lives in self-test-red-path.yml.
#
# actionlint's malformed-YAML catch (QA Scenario 3) is proven by orbit-ci.yml
# itself on every PR that touches a workflow file — a live one-off PR with a
# deliberately malformed workflow YAML (opened and closed without merging)
# is the standing proof for that scenario; see docs/GATE-EVIDENCE.md.

name: Orbit Self-Test (Live QA Proof — GREEN path)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * *'   # nightly regression proof that the reusable workflows still behave
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'self-test/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'self-test/**'

jobs:
  # ---- secret-detection: GREEN (fixture finding already in baseline) ----
  secret-detection-pass:
    uses: ./.github/workflows/secret-detection.yml
    permissions:
      contents: read
    with:
      baseline_path: self-test/fixtures/secrets/known.secrets.baseline
      base_ref: self-test/base

  # ---- secret-detection exclude_globs: GREEN (excluded path's fake secret
  # is skipped, even against a baseline that has NO entry for it and would
  # otherwise fail the job — see header comment) ----
  secret-detection-exclude-globs-pass:
    uses: ./.github/workflows/secret-detection.yml
    permissions:
      contents: read
    with:
      baseline_path: self-test/fixtures/secrets/exclude-globs/pass.secrets.baseline
      base_ref: self-test/base
      exclude_globs: "self-test/fixtures/secrets/exclude-globs/*"

  # ---- alembic-single-head: GREEN (1 head) ----
  alembic-single-head-pass:
    uses: ./.github/workflows/alembic-single-head.yml
    permissions:
      contents: read
    with:
      alembic_dir: self-test/fixtures/alembic-ok

  # ---- build-push-sha: contract GREEN (mocked — no AWS/ECR call) ----
  # (CR-A079-15) Validates the tag-resolution script + the Dockerfile/buildx
  # leg in isolation, since the real reusable workflow needs a live OIDC
  # role + ECR repo this self-test does not have and must not fake.
  build-push-sha-contract:
    name: build-push-sha contract (mocked push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: resolve-image-uri.sh contract — bare repo name
        run: |
          set -euo pipefail
          GOT=$(scripts/resolve-image-uri.sh "dummy-repo" "123456789012.dkr.ecr.us-east-1.amazonaws.com" "deadbeef00112233445566778899aabbccddeef")
          EXPECT="123456789012.dkr.ecr.us-east-1.amazonaws.com/dummy-repo:deadbeef00112233445566778899aabbccddeef"
          echo "got:    $GOT"
          echo "expect: $EXPECT"
          [ "$GOT" = "$EXPECT" ] || { echo "❌ resolve-image-uri.sh contract mismatch (bare repo name case)"; exit 1; }
          case "$GOT" in *latest*) echo "❌ resolved URI contains a mutable tag substring"; exit 1 ;; esac
          echo "✅ bare repo name → correctly qualified with registry, SHA-only tag"

      - name: resolve-image-uri.sh contract — pre-qualified repo URI (idempotent)
        run: |
          set -euo pipefail
          GOT=$(scripts/resolve-image-uri.sh "123456789012.dkr.ecr.us-east-1.amazonaws.com/dummy-repo" "123456789012.dkr.ecr.us-east-1.amazonaws.com" "deadbeef00112233445566778899aabbccddeef")
          EXPECT="123456789012.dkr.ecr.us-east-1.amazonaws.com/dummy-repo:deadbeef00112233445566778899aabbccddeef"
          echo "got:    $GOT"
          echo "expect: $EXPECT"
          [ "$GOT" = "$EXPECT" ] || { echo "❌ resolve-image-uri.sh contract mismatch (pre-qualified URI case)"; exit 1; }
          echo "✅ already-qualified repo URI → not double-prefixed with the registry"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build fixture image locally, push disabled (no ECR, no AWS creds)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: self-test/fixtures/build-push-sha
          file: self-test/fixtures/build-push-sha/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          tags: orbit-self-test/build-push-sha-fixture:mocked

  # ---- build-push-sha: mutable-tag invariant, GREEN + positive control ----
  # (CR-A079-15) Proves build-push-sha.yml's docker/build-push-action `tags:`
  # field never carries a mutable tag, AND that the check itself would catch
  # one if it were ever introduced (positive control — plant one in a
  # scratch copy, confirm it's caught, discard the scratch copy).
  build-push-sha-tag-invariant:
    name: build-push-sha mutable-tag invariant (+ positive control)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Extract the docker/build-push-action step's pushed-tags block
        id: extract
        run: |
          set -euo pipefail
          awk '/uses: docker\/build-push-action/,/^\S/{print}' .github/workflows/build-push-sha.yml \
            | grep -A5 'tags:' > .tags-block.txt || true
          echo "--- extracted tags: block ---"
          cat .tags-block.txt

      - name: Real file — must be 0 mutable-tag matches
        run: |
          set -euo pipefail
          COUNT=$(grep -c 'latest' .tags-block.txt || true)
          echo "mutable-tag matches in real file's tags: block: $COUNT"
          [ "$COUNT" -eq 0 ] || { echo "❌ build-push-sha.yml's pushed tags: block references a mutable tag"; exit 1; }
          echo "✅ no mutable tag in the real file"

      - name: Positive control — plant a mutable tag in a scratch copy, confirm it's caught
        run: |
          set -euo pipefail
          cp .github/workflows/build-push-sha.yml /tmp/build-push-sha.scratch.yml
          # Append a mutable-tag line right after the existing tags: line —
          # deliberately NOT reconstructing the real expression syntax here
          # (that would embed a GitHub Actions expression token in a run:
          # script that this job's own context can't resolve).
          sed -i '/^[[:space:]]*tags:/a\            some-registry/some-repo:latest' /tmp/build-push-sha.scratch.yml
          awk '/uses: docker\/build-push-action/,/^\S/{print}' /tmp/build-push-sha.scratch.yml \
            | grep -A5 'tags:' > /tmp/scratch-tags-block.txt || true
          echo "--- scratch (planted) tags: block ---"
          cat /tmp/scratch-tags-block.txt
          COUNT=$(grep -c 'latest' /tmp/scratch-tags-block.txt || true)
          echo "mutable-tag matches in scratch copy: $COUNT"
          [ "$COUNT" -gt 0 ] || { echo "❌ positive control FAILED — planted mutable tag was not caught"; exit 1; }
          rm -f /tmp/build-push-sha.scratch.yml /tmp/scratch-tags-block.txt
          echo "✅ positive control caught the planted mutable tag — the check is not a tautology"

  # ---- post-deploy-smoke: GREEN (real public URL, 200) ----
  post-deploy-smoke-pass:
    uses: ./.github/workflows/post-deploy-smoke.yml
    permissions:
      contents: read
    with:
      url: https://example.com
      expected_status: "200"
      retries: 3
      retry_delay_seconds: 5
